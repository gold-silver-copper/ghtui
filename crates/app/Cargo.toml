[package]
name = "ghtui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The library has everything; the binary runs it. The two share a name,
# so only the library is documented.
[[bin]]
name = "ghtui"
path = "src/main.rs"
doc = false

[dependencies]
ghtui-api.workspace = true
ghtui-diff.workspace = true
ghtui-store.workspace = true
ghtui-git.workspace = true
ghtui-theme.workspace = true
ghtui-ui.workspace = true
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
crossterm = { workspace = true, features = ["event-stream"] }
etcetera.workspace = true
futures = "0.3"
ratatui.workspace = true
ratatui-textarea.workspace = true
serde.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
proptest.workspace = true
ghtui-git.workspace = true
insta.workspace = true

[lints]
workspace = true
