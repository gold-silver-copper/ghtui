[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gold-silver-copper/ghtui"

[workspace.dependencies]
ghtui-api = { path = "crates/api" }
ghtui-schema = { path = "crates/schema" }
ghtui-store = { path = "crates/store" }
ghtui-git = { path = "crates/git" }
ghtui-diff = { path = "crates/diff" }
ghtui-theme = { path = "crates/theme" }
ghtui-ui = { path = "crates/ui" }

anyhow = "1.0.104"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs", "signal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml_edit = { version = "0.25.17", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.5"
clap = { version = "4.6.7", features = ["derive"] }
url = "2.5.8"
sha2 = "0.10"
tempfile = "3.27.0"
etcetera = "0.11.0"

ratatui = "0.30.2"
crossterm = "0.29.0"
ratatui-textarea = "0.9.2"

cynic = { version = "3.14.0", features = ["rkyv"] }
cynic-codegen = { version = "3.14.0", features = ["rkyv"] }
cynic-parser = { version = "0.11.2", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
http = "1"

redb = "4.3.0"
material-colors = "0.5.0"
terminal-colorsaurus = "1.0.3"

insta = "1.49.0"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
base64 = "0.23.1"

imara-diff = "0.2.0"
tree-sitter = "0.27.0"
tree-sitter-highlight = "0.27.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-yaml = "0.7.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-md = "0.5.3"
tree-sitter-bash = "0.25.1"

[workspace.lints.rust]
unsafe_code = "forbid"

# Panics are bugs, so non-test code can't contain them (tests are exempt
# from unwrap, expect, panic and indexing in clippy.toml). These are `deny`,
# not `forbid`: clap's derives allow the whole restriction group, which
# `forbid` rejects. Where a cast or similar is provably fine, say why with
# `#[expect(..., reason = "...")]`; a bare allow is refused.
[workspace.lints.clippy]
# Panics.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
get_unwrap = "deny"
fallible_impl_from = "deny"
manual_assert = "deny"
unchecked_time_subtraction = "deny"
large_stack_frames = "deny"
string_slice = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"
# Casts that lose or misread values.
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
lossy_float_literal = "deny"
# Ignoring what can fail, or leaking.
let_underscore_future = "deny"
unused_result_ok = "deny"
mem_forget = "deny"
# A suppression says why.
allow_attributes_without_reason = "deny"
# Writing to the terminal behind ratatui's back corrupts the screen.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
# Tests say what they expect.
assertions_on_result_states = "warn"
# Style.
redundant_clone = "warn"
needless_pass_by_value = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
match_wildcard_for_single_variants = "warn"
needless_pass_by_ref_mut = "warn"
redundant_closure_for_method_calls = "warn"
map_unwrap_or = "warn"
items_after_statements = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
explicit_iter_loop = "warn"
if_not_else = "warn"
str_to_string = "warn"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 4
