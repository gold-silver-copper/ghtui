[package]
name = "ghtui"
version = "0.2.2"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gold-silver-copper/ghtui"
description = "A keyboard-driven terminal client for GitHub, with a pull request diff viewer that goes further than GitHub's"
readme = "README.md"
keywords = ["github", "tui", "terminal", "code-review", "diff"]
categories = ["command-line-utilities", "development-tools"]
# What the package needs to build; the tests and their recorded data stay
# in the repository.
include = ["/src/**/*.rs", "/src/schema/github.graphql", "/build.rs", "/README.md", "/LICENSE-*"]

# `cargo xtask live` (in `xtask/`) checks ghtui in the real app, against
# real GitHub; it's run by hand, not by `cargo test`.
[workspace]
members = [".", "xtask"]
# Agent and tool worktrees nested here are projects of their own.
exclude = [".claude"]

# The library has everything; the binary runs it. The two share a name,
# so only the library is documented.
[[bin]]
name = "ghtui"
path = "src/main.rs"
doc = false

[features]
default = ["lang-rust", "lang-typescript", "lang-javascript", "lang-python", "lang-go", "lang-json", "lang-yaml", "lang-toml", "lang-markdown", "lang-bash"]
lang-rust = ["dep:tree-sitter-rust"]
lang-typescript = ["dep:tree-sitter-typescript"]
lang-javascript = ["dep:tree-sitter-javascript"]
lang-python = ["dep:tree-sitter-python"]
lang-go = ["dep:tree-sitter-go"]
lang-json = ["dep:tree-sitter-json"]
lang-yaml = ["dep:tree-sitter-yaml"]
lang-toml = ["dep:tree-sitter-toml-ng"]
lang-markdown = ["dep:tree-sitter-md"]
lang-bash = ["dep:tree-sitter-bash"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
etcetera = "0.11.0"
ratatui = "0.30.2"
ratatui-textarea = "0.9.2"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs", "signal"] }
toml_edit = { version = "0.25.17", features = ["serde"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"
cynic = { version = "3.14.0", features = ["rkyv"] }
cynic-parser = { version = "0.11.2", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
http = "1"
thiserror = "2.0.21"
redb = "4.3.0"
material-colors = "0.5.0"
terminal-colorsaurus = "1.0.3"
pulldown-cmark = { version = "0.13.4", default-features = false }
imara-diff = "0.2.0"
tree-sitter = "0.27.0"
tree-sitter-highlight = "0.27.0"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3"
unicode-segmentation = "1"
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-python = { version = "0.25.0", optional = true }
tree-sitter-go = { version = "0.25.0", optional = true }
tree-sitter-json = { version = "0.24.8", optional = true }
tree-sitter-yaml = { version = "0.7.2", optional = true }
tree-sitter-toml-ng = { version = "0.7.0", optional = true }
tree-sitter-md = { version = "0.5.3", optional = true }
tree-sitter-bash = { version = "0.25.1", optional = true }

[build-dependencies]
cynic-codegen = { version = "3.14.0", features = ["rkyv"] }

[dev-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
insta = "1.49.0"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
tokio = { version = "1.53.2", features = ["net", "rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs", "signal"] }

[lints.rust]
unsafe_code = "forbid"

# Panics are bugs, so non-test code can't contain them (tests are exempt
# from unwrap, expect, panic and indexing in clippy.toml). These are `deny`,
# not `forbid`: clap's derives allow the whole restriction group, which
# `forbid` rejects. Where a cast or similar is provably fine, say why with
# `#[expect(..., reason = "...")]`; a bare allow is refused.
[lints.clippy]
# Panics.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
get_unwrap = "deny"
fallible_impl_from = "deny"
manual_assert = "deny"
unchecked_time_subtraction = "deny"
large_stack_frames = "deny"
string_slice = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"
# Casts that lose or misread values.
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
lossy_float_literal = "deny"
# Ignoring what can fail, or leaking.
let_underscore_future = "deny"
unused_result_ok = "deny"
mem_forget = "deny"
# A suppression says why.
allow_attributes_without_reason = "deny"
# Writing to the terminal behind ratatui's back corrupts the screen.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
# Tests say what they expect.
assertions_on_result_states = "warn"
# Style.
redundant_clone = "warn"
needless_pass_by_value = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
match_wildcard_for_single_variants = "warn"
needless_pass_by_ref_mut = "warn"
redundant_closure_for_method_calls = "warn"
map_unwrap_or = "warn"
items_after_statements = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
explicit_iter_loop = "warn"
if_not_else = "warn"
str_to_string = "warn"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 4
