[package]
name = "ghtui-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Not part of the workspace: needs nightly and cargo-fuzz.
# Run from the repo root: `cargo +nightly fuzz run markdown`.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ghtui = { path = ".." }
ratatui = "0.30.2"

[[bin]]
name = "markdown"
path = "fuzz_targets/markdown.rs"
test = false
doc = false
bench = false

[[bin]]
name = "file_diff"
path = "fuzz_targets/file_diff.rs"
test = false
doc = false
bench = false

[[bin]]
name = "route"
path = "fuzz_targets/route.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire"
path = "fuzz_targets/wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "job_log"
path = "fuzz_targets/job_log.rs"
test = false
doc = false
bench = false
